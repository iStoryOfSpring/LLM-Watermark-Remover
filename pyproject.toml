[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rewrite-desk"
version = "0.1.0"
description = "Local-first, document-faithful, constrained lexical rewriting service"
license = { file = "LICENSE" }
authors = [{ name = "Chen Siyu" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "lxml>=5.2",
  "python-docx>=1.1",
  "jieba>=0.42",
  "numpy>=1.26",
  "safetensors>=0.4",
  "transformers>=4.57.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
local-llm = [
  "torch>=2.6",
]
semantic = [
  "onnxruntime>=1.18",
]

[project.scripts]
local-rewrite = "backend.app.cli:main"
local-rewrite-mcp = "backend.app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.dictionaries" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
